interface:
  display_name: "Deep Dig 文档抽取"
  short_description: "在本地解析科研论文并调用托管服务生成材料数据工作簿"
  default_prompt: "Use $deep-dig to parse a local paper, submit the requested properties to the hosted service, and download the workbook."

dependencies:
  tools:
    - type: "mcp"
      value: "deep-dig"
      description: "Hosted authenticated Deep Dig submission, status, and workbook tools"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
