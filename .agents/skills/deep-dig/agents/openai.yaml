interface:
  display_name: "Deep Dig 文档抽取"
  short_description: "本地解析科研文档并编排材料数据抽取与 Excel 导出"
  default_prompt: "Use $deep-dig to parse a local paper, extract the requested material properties, and export the result."

dependencies:
  tools:
    - type: "mcp"
      value: "deep-dig"
      description: "Dockerized local parser and Deep Dig extraction tools"
      transport: "stdio"

policy:
  allow_implicit_invocation: true

