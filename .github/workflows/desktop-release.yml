name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            bundles: app,dmg
            artifact_name: deep-dig-macos-arm64
            artifact_path: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS Intel
            runner: macos-15-intel
            bundles: app,dmg
            artifact_name: deep-dig-macos-x64
            artifact_path: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows x64
            runner: windows-2025
            bundles: msi,nsis
            artifact_name: deep-dig-windows-x64
            artifact_path: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/desktop/uv.lock

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install parser build dependencies
        working-directory: apps/desktop
        run: uv sync --frozen --group build

      - name: Validate release configuration
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.DESKTOP_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.DESKTOP_SUPABASE_ANON_KEY }}
        run: |
          : "${VITE_API_BASE_URL:?Set the DESKTOP_API_BASE_URL repository variable}"
          : "${VITE_SUPABASE_URL:?Set the DESKTOP_SUPABASE_URL repository variable}"
          : "${VITE_SUPABASE_ANON_KEY:?Set the DESKTOP_SUPABASE_ANON_KEY repository secret}"

      - name: Build installers
        working-directory: apps/desktop
        env:
          VITE_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.DESKTOP_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.DESKTOP_SUPABASE_ANON_KEY }}
          VITE_DEV_AUTH_TOKEN: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --draft --generate-notes --verify-tag
