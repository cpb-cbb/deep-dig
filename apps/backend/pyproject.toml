[project]
name = "deep-dig-backend"
version = "0.1.0"
description = "Deep Dig FastAPI backend and worker"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "arq>=0.26.1",
  "asyncpg>=0.30.0",
  "cryptography>=43.0.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "json-repair>=0.59.10",
  "markitdown[pdf]>=0.1.4",
  "orjson>=3.10.12",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.12",
  "redis>=5.2.1",
  "sentry-sdk[fastapi]>=2.19.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
