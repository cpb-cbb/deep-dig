[project]
name = "deep-dig-desktop-parser"
version = "0.1.0"
description = "Local PDF-to-Markdown parser used by the Deep Dig desktop client"
requires-python = ">=3.12"
dependencies = [
    "pymupdf4llm>=1.27.2.3",
]

[project.scripts]
deep-dig-parse-pdf = "desktop_parser.parse_pdf:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["desktop_parser*"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
