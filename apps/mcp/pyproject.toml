[project]
name = "deep-dig-mcp"
version = "0.1.0"
description = "Local MarkItDown parser, MCP server, and web UI for Deep Dig"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "jinja2>=3.1.5",
  "markitdown[pdf]>=0.1.3",
  "mcp[cli]>=1.26.0,<2",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "pypdf>=5.1.0",
  "python-multipart>=0.0.20",
  "rpds-py==0.22.3",
  "uvicorn[standard]>=0.34.0",
]

[project.scripts]
deep-dig-mcp = "deep_dig_mcp.server:main"
deep-dig-web = "deep_dig_mcp.web:main"

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deep_dig_mcp"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
