[project]
name = "deep-dig-visual"
version = "0.1.0"
description = "Optional local visual client for Deep Dig"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "jinja2>=3.1.5",
  "markitdown[pdf]>=0.1.3",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "pypdf>=5.1.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34.0",
]

[project.scripts]
deep-dig-web = "deep_dig_mcp.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deep_dig_mcp"]
